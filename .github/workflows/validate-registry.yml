name: validate-registry

on:
  push:
    paths:
      - "variable_registry.source.csv"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "variable_registry.source.csv"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/validate-registry.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl
      - run: make build
      - run: make validate
      - run: make diff-clean
